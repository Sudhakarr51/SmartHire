
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire - Resume Analyzer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        header {
            background: #172554;
            color: white;
            padding: 24px 8%;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 4px 16px #00000012;
        }

        h2 {
            color: #172554;
        }

        .status {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <header>
        <h1>SmartHire</h1>
        <p>Resume and Job Match Analyzer</p>
    </header>

    <main>
        <section class="card">
            <h2>Welcome to SmartHire</h2>
            <p>Analyze your resume and prepare for your career opportunities.</p>
            <p class="status">Application is running successfully!</p>
            <p>The SmartHire homepage is now connected to Spring Boot.</p>
        </section>
    </main>

    <footer>
        SmartHire | Resume and Job Match Analyzer
    </footer>
</body>
</html>
