spring.application.name=smarthire

# Credentials come from environment variables (never hardcode them)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/smarthire_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# "update" lets Hibernate create/alter tables automatically (fine for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Upload limits (PDF only is enforced again in Java code)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
